name: Nightly District Risk Refresh

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-risk
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run district risk pipeline
        run: PYTHONPATH=. python pipeline/run_district.py --refresh

      - name: Copy geojson artefacts into web/public
        run: cp artefacts/risk*.geojson web/public/

      - name: Verify ledger chain integrity
        run: PYTHONPATH=. python -c "from adapters.ledger import verify_chain; ok,msg=verify_chain(); print(msg); exit(0 if ok else 1)"

      - name: Commit and push updated artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artefacts/risk*.geojson artefacts/ledger.jsonl web/public/risk*.geojson
          git diff --cached --quiet || git commit -m "Nightly risk refresh [skip ci]"
          git push
